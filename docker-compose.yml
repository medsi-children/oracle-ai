services:
  db:
    image: postgres:16-alpine
    container_name: oracle-ai-db
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: oracle
      POSTGRES_DB: oracle_ai
    ports:
      - "5432:5432"
    volumes:
      - oracle_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d oracle_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: oracle-ai-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  oracle_ai_postgres:
